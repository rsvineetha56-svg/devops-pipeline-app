services:
  app:
    build: .
    image: devops-demo-app:latest
    container_name: devops-demo-app
    ports:
      - "5000:5000"
    restart: unless-stopped
  prometheus:
    build: ./prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
